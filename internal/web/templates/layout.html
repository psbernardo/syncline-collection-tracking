{{ define "layout" }}
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/app.css"><script defer src="/static/htmx.min.js"></script><script defer src="/static/app.js?v=2"></script><script defer src="/static/alpine.min.js"></script>
  <title>{{ .Title }} | Syncline</title>
</head>
<body class="app-body" x-data="{ navOpen: false }">
  <div class="app-shell">
    {{ template "navigation" . }}
    <div class="main-shell">
      <div id="snackbar-region" class="snackbar-container" x-data="snackbarQueue()" @snackbar.window="push($event.detail)"><template x-for="message in messages" :key="message.id"><div class="snackbar" :class="tone(message.type)" x-show="message.visible" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-x-2" x-transition:enter-end="opacity-100 translate-x-0" x-transition:leave="transition ease-in duration-700" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" :role="message.type === 'error' ? 'alert' : 'status'" :aria-live="message.type === 'error' ? 'assertive' : 'polite'"><div><strong x-text="message.title"></strong><p x-text="message.message"></p></div><button type="button" @click="dismiss(message)" aria-label="Dismiss message">Close</button></div></template></div>
      <main class="container">{{ block "content" . }}{{ end }}</main>
    </div>
  </div>
</body>
</html>
{{ end }}
