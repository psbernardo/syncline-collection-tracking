{{ define "content" }}<section class="page-heading"><div><p class="eyebrow">Trading master data</p><h1>{{ .Title }}</h1></div></section><section class="panel form-panel"><form method="post" action="{{ .Action }}"><input type="hidden" name="idempotency_key" value="{{ .Key }}"><input type="hidden" name="row_version" value="{{ .Version }}"><label>Name<input name="name" value="{{ .Supplier.Name }}" required>{{ with index .Errors "Name" }}<span class="field-error">{{ . }}</span>{{ end }}</label><label>Contact person<input name="contact_person" value="{{ .Supplier.ContactPerson }}"></label><label>Contact number<input name="contact_number" value="{{ .Supplier.ContactNumber }}"></label><label>Email<input type="email" name="email" value="{{ .Supplier.Email }}"></label><label>Billing address<input name="billing_address" value="{{ .Supplier.BillingAddress }}"></label><label>Delivery address<input name="delivery_address" value="{{ .Supplier.DeliveryAddress }}"></label><label>Tax/business identifier<input name="tax_identifier" value="{{ .Supplier.TaxIdentifier }}"></label>{{ if .Version }}<label class="checkbox"><input type="checkbox" name="is_active"{{ if .Supplier.IsActive }} checked{{ end }}> Active</label>{{ end }}<div class="form-actions"><a class="button" href="/suppliers">Cancel</a>{{ if and .Version .Supplier.IsActive }}<a class="button" href="/suppliers/{{ .Supplier.ID }}/products">Configure products</a>{{ end }}<button class="button button-primary" type="submit">Save</button></div></form></section>{{ end }}
