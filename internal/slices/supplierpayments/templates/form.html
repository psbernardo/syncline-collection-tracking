{{ define "content" }}
<div class="page-heading"><div><p class="eyebrow">Procurement</p><h1>{{ if .Edit }}Edit supplier payment{{ else }}Add supplier payment{{ end }}</h1><p class="muted">Record a check issued to a supplier and its due date.</p></div><a class="button" href="/supplier-payments">Back to supplier payments</a></div>
<section class="card form-card">
  {{ if .Error }}<p class="error" role="alert">{{ .Error }}</p>{{ end }}
  <form method="post" action="{{ if .Edit }}/supplier-payments/{{ .Values.ID }}{{ else }}/supplier-payments{{ end }}">
    {{ if .Edit }}<input type="hidden" name="row_version" value="{{ .Values.RowVersion }}">{{ end }}
    <div class="form-grid">
      <label>Supplier <select name="supplier_id" required><option value="">Select supplier</option>{{ range .Suppliers }}<option value="{{ .ID }}"{{ if eq .ID $.Values.SupplierID }} selected{{ end }}>{{ .Name }}</option>{{ end }}</select></label>
      <label>Check number <input name="check_number" type="text" maxlength="100" value="{{ .Values.CheckNumber }}" required></label>
      <label>Issue date <input name="issue_date" type="date" value="{{ .Values.IssueDate }}" required></label>
      <label>Due date <input name="due_date" type="date" value="{{ .Values.DueDate }}" required></label>
      <label>Amount (PHP) <input name="amount" type="number" min="0.0001" step="0.0001" value="{{ .Values.Amount }}" required></label>
    </div>
    <div class="form-actions"><button class="button button-primary" type="submit">{{ if .Edit }}Save changes{{ else }}Add payment{{ end }}</button><a class="button" href="/supplier-payments">Cancel</a></div>
  </form>
</section>
{{ end }}
