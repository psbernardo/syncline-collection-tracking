{{ define "content" }}<section class="page-heading"><div><p class="eyebrow">Trading master data</p><h1>{{ .Title }}</h1></div></section><section class="panel form-panel"><form method="post" action="{{ .Action }}"><input type="hidden" name="idempotency_key" value="{{ .Key }}"><input type="hidden" name="row_version" value="{{ .Version }}"><label>SKU<input name="sku" value="{{ .Product.SKU }}" required>{{ with index .Errors "SKU" }}<span class="field-error">{{ . }}</span>{{ end }}</label><label>Name<input name="name" value="{{ .Product.Name }}" required>{{ with index .Errors "Name" }}<span class="field-error">{{ . }}</span>{{ end }}</label><label>Description<textarea name="description">{{ .Product.Description }}</textarea></label><label>Base UOM<select name="uom">{{ range .UOMOptions }}<option value="{{ . }}"{{ if eq $.Product.UOM (printf "%s" .) }} selected{{ end }}>{{ . }}</option>{{ end }}</select>{{ with index .Errors "UOM" }}<span class="field-error">{{ . }}</span>{{ end }}</label>{{ if eq .Mode "edit" }}<label class="checkbox"><input type="checkbox" name="is_active"{{ if .Product.IsActive }} checked{{ end }}> Active</label>{{ end }}<div class="form-actions"><a class="button" href="/products">Cancel</a><button class="button button-primary" type="submit">Save</button></div></form></section>{{ end }}
